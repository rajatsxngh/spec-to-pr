[project]
name = "spec-to-pr"
version = "0.1.0"
description = "Coding-agent harness that turns a spec into a tested draft pull request"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=2.6.0",
    "httpx>=0.28.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "typer>=0.27.3",
]

[project.scripts]
spec-to-pr = "spec_to_pr.cli:main"

[project.optional-dependencies]
tracing = [
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
]
report = [
    "matplotlib>=3.11.2",
]
# The mini-swe-agent baseline (src/spec_to_pr/baseline.py). Pinned: the adapter uses its agent class,
# environment protocol and SWE-bench prompts, so an upgrade must be checked against tests/test_baseline.py.
baseline = [
    "mini-swe-agent==2.4.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "mini-swe-agent==2.4.6",
    "opentelemetry-sdk>=1.45.2",
    "pytest>=9.2.0",
]
