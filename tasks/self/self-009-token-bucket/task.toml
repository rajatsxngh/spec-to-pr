statement = """
`TokenBucket` lets far too many requests through after it has been idle: tokens keep piling up past
`capacity`. The bucket should never hold more than `capacity` tokens, and asking for a `cost` larger
than `capacity` should raise `ValueError` (it could never succeed).
"""
